# Example configuration for flightprice. Copy to config.toml and edit.
# Secrets (the SerpApi key, an ntfy token) never go here: they come from the
# environment or Docker secrets (SERPAPI_KEY / SERPAPI_KEY_FILE).

[passengers]
adults = 2
children = 0            # child fares usually apply from 2 to 11 years

[route]
origins = ["FRA", "MUC"]          # departure airports, each checked separately
destination = ["JFK", "EWR"]      # any of these counts as the destination
cabin = "economy"
currency = "EUR"
market = "de"                     # Google's country (gl); prices can differ by market

[constraints]           # what counts as an acceptable itinerary
max_stops = 1
max_duration_h = 14     # outbound travel time; 0 = no limit

# One [[option]] per fixed date combination to track.
[[option]]
name = "A"
depart = 2027-05-10
return = 2027-05-24     # departure date of the return flight
home_by = 2027-05-25    # shown on the page; must be on or after return

[[option]]
name = "B"
depart = 2027-06-07
return = 2027-06-21
home_by = 2027-06-22

[budget]
monthly_calls = 250     # SerpApi searches per quota cycle
reserve = 10            # kept back for "Search now" and retries
reset_day = 1           # day of the month the quota renews (see your SerpApi account)
max_days_ahead = 331    # an option whose return is further out is not searched yet:
                        # Google has no flights that far ahead, and empty searches still count

[weights]               # optional, default 1; higher = checked more often
# FRA = 2

[alert]
total_below = 1500      # total for all passengers, in the currency above
min_improvement = 50    # a new alert needs a price this much below the last one
ntfy_url = "https://ntfy.sh"
ntfy_topic = "change-me"

[schedule]
time = "07:00"
timezone = "Europe/Berlin"

[web]
listen = ":8080"
